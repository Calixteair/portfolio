# Included in every location: nginx drops server-level add_header directives as
# soon as a location declares its own add_header, so they live here instead.

# The full CSP (with script/style hashes) is a <meta> generated by Astro.
# A <meta> CSP cannot carry frame-ancestors, so that part is sent as a header;
# browsers enforce both policies.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
