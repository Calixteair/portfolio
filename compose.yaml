# Local test of the production image: docker compose up -d --build → http://localhost:8088
# The VPS uses deploy/compose.yaml (prebuilt image from GHCR).
services:
  portfolio:
    build: .
    image: portfolio:local
    ports:
      - '127.0.0.1:8088:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
