# Static Astro build behind Nginx Proxy Manager (which terminates TLS and HTTP/2).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind a proxy: never leak the internal port in redirects.
    absolute_redirect off;

    # 3D assets on top of the stock mime.types (wasm is already there).
    # A `types` block replaces the inherited map instead of extending it, so the
    # stock map is re-included at the same level (same-level blocks are merged).
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        image/ktx2 ktx2;
    }

    # Files are pre-compressed at build time (gzip -9); on-the-fly gzip as fallback.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm model/gltf-binary;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundles: cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so a deploy is visible immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
