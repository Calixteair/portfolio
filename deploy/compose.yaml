# Production stack on the VPS: /home/calixteair/docker/apps/portfolio/compose.yaml
# Deployed by stack-sync on a signed release tag vX.Y.Z (Jenkins: ssh ci-portfolio vX.Y.Z ->
# ci-deploy-self.sh -> stack-sync.sh): the VPS checks the signature, pins web-latest to vX.Y.Z-web
# (immutable in Harbor) and installs this file. No secrets (bao-deploy no-secrets marker).
services:
  portfolio:
    image: registry.calixteair.fr/portfolio/portfolio:web-latest
    container_name: portfolio
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - nginx-reverse-proxy

networks:
  nginx-reverse-proxy:
    external: true
