# Push to newgen: CI gate -> image (scan, sign) -> deploy to portfolio.calixteair.fr.
# The VPS only ever pulls :prod, and :prod is moved only after the scan passed:
# what runs in production is always a scanned image, without passing a digest
# through the SSH ForceCommand.
name: release

on:
  push:
    branches: [newgen]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/calixteair/portfolio

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: build, scan, sign
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR with the workflow token, no stored secret
      id-token: write # keyless cosign signature (OIDC identity of this workflow)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable sha tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: BUILD_SHA=${{ github.sha }}
          # SBOM and SLSA provenance attached to the image by BuildKit.
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Rebuild the runtime stage every time: a cached `apk upgrade` layer would ship
          # stale Alpine packages that Trivy then blocks. The build stage stays cached.
          no-cache-filters: runtime

      - name: Scan image (blocks on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Promote to :prod
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:prod" "$IMAGE@$DIGEST"

  deploy:
    name: deploy portfolio.calixteair.fr
    needs: image
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://portfolio.calixteair.fr
    concurrency:
      group: deploy-portfolio
      cancel-in-progress: false
    steps:
      # Native ssh with the VPS host key pinned (anti-MITM). No command is sent:
      # the ForceCommand only runs ci-deploy-self.sh -> bao-deploy.sh portfolio.
      - name: Trigger remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Public host key of srv470430 (not a secret). Update it if the VPS host key is rotated.
          KNOWN_HOST: vps-calixteair ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1YMD+MmFX6DQwYbIu8Reuhwl9if0IMoJp4gGHyo/Pg
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          timeout 5m ssh -T -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o HostKeyAlias=vps-calixteair -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"

      - name: Smoke test (new version live, security headers present)
        env:
          URL: https://portfolio.calixteair.fr/
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            # Fetch the whole page first: grep -q stops at the first match, and curl then
            # fails writing the rest (error 23), which pipefail turns into a failure.
            page=$(curl -fsS "$URL" || true)
            if grep -q "name=\"x-build\" content=\"$SHA\"" <<<"$page"; then
              break
            fi
            [ "$i" = 6 ] && { echo "build $SHA not live"; exit 1; }
            sleep 10
          done
          headers=$(curl -fsSI "$URL")
          for h in content-security-policy strict-transport-security x-content-type-options \
                   referrer-policy permissions-policy x-frame-options; do
            grep -qi "^$h:" <<<"$headers" || { echo "missing header: $h"; exit 1; }
          done
          echo "build $SHA live, headers OK"
